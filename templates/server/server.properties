# Small private survival server; no remote administration endpoints.
online-mode=true
white-list=true
enforce-whitelist=true
max-players=10
view-distance=10
simulation-distance=6
difficulty=normal
gamemode=survival
force-gamemode=false
hardcore=false
pvp=true
enable-command-block=false
allow-flight=false
spawn-protection=16
server-ip=
server-port=25565
enable-status=true
enable-query=false
enable-rcon=false
broadcast-rcon-to-ops=false
management-server-enabled=false
level-name=world
# Keep server ticks running so scheduled backups also run with no players online.
pause-when-empty-seconds=0
level-type=minecraft:normal
motd=Minecraft Vanilla Stack
